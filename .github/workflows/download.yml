name: Remote Downloader

on:
  push:
    paths:
      - 'links.txt'

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Install Tools
      run: pip install yt-dlp

    - name: Read URL and Download
      run: |
        URL=$(cat links.txt)
        yt-dlp -o "video.%(ext)s" "$URL"

    - name: Create ZIP
      run: zip -r downloaded_video.zip video.*

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: my-video-zip
        path: downloaded_video.zip
