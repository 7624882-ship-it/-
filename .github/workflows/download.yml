name: AI Video Generator Bot

on:
  repository_dispatch:
    types: [email_received]

jobs:
  generate_video:
    runs-on: ubuntu-latest
    steps:
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    - name: Install Tools
      run: pip install fal-client

    - name: Run AI Generation
      id: ai_run
      env:
        FAL_KEY: ${{ secrets.FAL_KEY }}
      run: |
        # פקודת פייתון שמפעילה את ה-API ומחכה לסרטון
        python -c "
        import fal_client, os
        import urllib.request

        prompt = '${{ github.event.client_payload.body }}'
        print(f'Generating video for prompt: {prompt}')

        # קריאה למודל יצירת וידאו מתקדם (Luma או Fast-Video)
        result = fal_client.subscribe(
            'fal-ai/luma-dream-machine',
            config={
                'prompt': prompt
            }
        )
        
        # קבלת הקישור של הסרטון המוכן מהבינה המלאכותית
        video_url = result['video']['url']
        
        # הורדת הסרטון למחשב של GitHub
        urllib.request.urlretrieve(video_url, 'ai_video.mp4')
        "

    - name: Create ZIP
      run: zip -r ai_video.zip ai_video.mp4

    - name: Upload and Get Direct Link
      id: upload
      run: |
        LINK=$(curl --upload-file ai_video.zip https://transfer.sh/ai_video.zip)
        echo "download_link=$LINK" >> $GITHUB_OUTPUT

    - name: Send Link Back to Email
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: smtp.gmail.com
        server_port: 465
        username: ${{ secrets.EMAIL_USERNAME }}
        password: ${{ secrets.EMAIL_PASSWORD }}
        subject: הסרטון מהבינה המלאכותית מוכן!
        to: ${{ github.event.client_payload.sender }}
        from: GitHub AI Bot
        body: |
          הנה קישור ישיר להורדת קובץ ה-ZIP של סרטון הבינה המלאכותית שלך:
          ${{ steps.upload.outputs.download_link }}
          
          הקישור זמין ל-14 יום. תהנה!
