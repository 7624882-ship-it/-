name: Remote Downloader

on:
  push:
    paths:
      - 'links.txt'

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Install Tools
      run: pip install yt-dlp

    - name: Read URL and Download
      run: |
        URL=$(cat links.txt)
        yt-dlp -o "video.%(ext)s" "$URL"

    - name: Create ZIP
      run: zip -r downloaded_video.zip video.*

    - name: Send ZIP to Email
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: smtp.gmail.com
        server_port: 465
        username: ${{ secrets.EMAIL_USERNAME }}
        password: ${{ secrets.EMAIL_PASSWORD }}
        subject: הסרטון החסום שלך מוכן!
        to: ${{ secrets.MY_TARGET_EMAIL }}
        from: GitHub Downloader
        body: קובץ ה-ZIP מצורף למייל זה.
        attachments: downloaded_video.zip
